name: Arama hatırlatma kontrolü

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hatırlatma endpoint'ini tetikle
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://panel.zihingo.com/api/cron/call-reminders
